name: Development build

on:
  pull_request:
    branches-ignore:
      - l10n_main
  push:
    branches-ignore:
      - l10n_main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS with built-in StikJIT
    uses: ./.github/workflows/build.yml
    with:
      platform: 2
      platform_name: ios

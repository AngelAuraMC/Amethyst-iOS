name: Release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release (${{ matrix.platform_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 2
            platform_name: ios
          - platform: 3
            platform_name: tvos
          - platform: 7
            platform_name: iossimulator
          - platform: 8
            platform_name: tvossimulator
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      platform_name: ${{ matrix.platform_name }}
      release: true

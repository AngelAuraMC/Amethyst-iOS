workflows:
  amethyst-ios:
    name: Amethyst iOS
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Initialize submodules
        script: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install build dependencies
        script: |
          brew update
          brew install cmake wget ldid
          brew install --cask temurin@8 || true
          /usr/libexec/java_home -V
          cmake --version
          ldid -h || true

      - name: Build Amethyst IPA
        script: |
          export JAVA_HOME="$(/usr/libexec/java_home -v 1.8)"
          export PATH="$JAVA_HOME/bin:$PATH"
          make RELEASE=1

      - name: Show artifacts
        script: |
          find artifacts -maxdepth 2 -type f -print || true

    artifacts:
      - artifacts/*.ipa
      - artifacts/**/*.ipa
      - artifacts/**/*.dSYM
      - artifacts/**/*.dSYM.zip
